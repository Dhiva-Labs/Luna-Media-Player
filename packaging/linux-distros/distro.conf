# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with tool/make_deb.sh.

NAME=luna-media-player
APP_NAME=Luna-Media-Player
GITHUB_REPO=Dhiva-Labs/Luna-Media-Player
TAG_PREFIX=v
SUMMARY='XP-era music and video player for the Linux desktop'
DESCRIPTION='Luna Media Player plays the music and video already on your machine, wrapped in the look of the desktop players of 2004: a library, a playlist pane, and eight flowing visualisations. Built with Flutter; playback by libmpv, so it opens essentially any format your system can decode.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/Luna-Media-Player
LICENSE=MIT
LICENSE_FILE=LICENSE

# The .deb carries Ubuntu's libmpv.so.2 and gets its ffmpeg chain from the
# libmpv2 package it depends on. That libmpv links Ubuntu's sonames
# (libavcodec.so.60, libplacebo.so.338, ...), which Fedora, openSUSE and Arch
# do not have, so the .rpm and the Arch package leave it out and use the
# distribution's own libmpv instead (Fedora mpv-libs, openSUSE libmpv2, Arch
# mpv), together with that distribution's ffmpeg. The application binary is
# the same; libmpv.so.2 keeps its ABI across mpv releases.
PACKAGE_EXCLUDE=(opt/luna-media-player/lib/libmpv.so.2)

# rpm: libmpv.so.2()(64bit) and the GTK sonames are worked out from the ELF
# files; the app runs no other programs.
RPM_REQUIRES=()
ARCH_DEPENDS=(gtk3 mpv)
ARCH_INDEPENDENT=0

# AppImage: built from the tree bundle-libmpv.sh made self-contained (CI
# passes it as APPIMAGE_ROOT), because an AppImage cannot depend on a
# distribution package.
APPIMAGE=1
EXEC=opt/luna-media-player/luna_media_player
DESKTOP=usr/share/applications/luna-media-player.desktop
ICON=usr/share/icons/hicolor/512x512/apps/luna-media-player.png
APPRUN_ENV=''

# What bundle-libmpv.sh leaves to the host for the AppImage, on top of GTK 3
# (which every GTK AppImage expects): the GL/GPU stack and ALSA, which must
# match the host's drivers and sound setup. Every desktop installs them;
# Fedora's container image does not, so verify.sh adds them there.
APPIMAGE_HOST_PACKAGES_FEDORA='gtk3 mesa-libEGL mesa-libGL mesa-libgbm libdrm alsa-lib'

# Smoke tests run in each distribution container by verify.sh. The GTK
# runner shows its window only after Flutter rendered the first frame, and
# the binary links libmpv, so a visible "Luna Media Player" window proves
# the AOT snapshot ran with the whole playback chain loaded.
GUI_CMD=luna-media-player
GUI_WINDOW='^Luna Media Player$'
SMOKE_SECONDS=90
SMOKE_CMD=''
